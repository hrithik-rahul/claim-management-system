
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Authentication APIs
    location /auth/ {
        proxy_pass http://claim-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Customer and Manager APIs
    location /api/ {
        proxy_pass http://claim-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Angular routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
